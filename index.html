<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16123a">
<meta name="description" content="مدرسة الأبطال - منصة تعليمية مجانية للأطفال (الصف الثاني الابتدائي - المنهج المصري)">
<title>مدرسة الأبطال | Heroes Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
/* ============ الأساسيات والألوان (تتغير حسب البطل) ============ */
:root{
  --ink:#16123a; --pop:#ffd400; --ok:#19b34f; --bad:#ee3a3a; --paper:#ffffff; --soft:#eef0ff;
  --main:#e62429; --main-ink:#ffffff; --bg-a:#1c2f9a; --bg-b:#a5121f;
  --sh:5px 5px 0 var(--ink); --r:18px;
}
body[data-hero="spiderman"]{--main:#e62429;--main-ink:#fff;--bg-a:#1c2f9a;--bg-b:#a5121f}
body[data-hero="batman"]{--main:#ffc400;--main-ink:#16123a;--bg-a:#0f1120;--bg-b:#343b63}
body[data-hero="superman"]{--main:#1f5bff;--main-ink:#fff;--bg-a:#0b2a80;--bg-b:#c2141c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Baloo Bhaijaan 2","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  color:#fff;min-height:100vh;min-height:100dvh;line-height:1.5;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body.lang-en{font-family:"Baloo 2","Baloo Bhaijaan 2","Segoe UI",system-ui,sans-serif}
button,input{font-family:inherit}
#bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(rgba(0,0,0,.2) 22%,transparent 24%) 0 0/14px 14px,linear-gradient(160deg,var(--bg-a),var(--bg-b))}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
#app{max-width:560px;margin:0 auto;padding:12px 14px 48px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ============ عناصر عامة ============ */
.panel{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.glass{background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.55);border-radius:var(--r);padding:12px 14px}
.center{text-align:center}
.lead{font-size:1.1rem;font-weight:500;margin:6px 0 12px}
.lbl{display:block;font-weight:800;font-size:1.05rem;margin:14px 0 6px}
.err{color:var(--bad);font-weight:800;min-height:1.6em;margin:6px 0}
.title-pop{font-weight:800;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);letter-spacing:.01em}
body.lang-en .title-pop,.brand-en{font-family:"Bangers","Baloo 2",system-ui,sans-serif;font-weight:400;letter-spacing:.05em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:10px 18px;
  border:4px solid var(--ink);border-radius:16px;background:var(--main);color:var(--main-ink);
  font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.subject:focus-visible,.lesson:focus-visible,.hero-card:focus-visible,.iconbtn:focus-visible,.input:focus-visible{outline:4px solid var(--pop);outline-offset:3px}
.btn.alt{background:#fff;color:var(--ink)}
.btn.green{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{min-height:48px;font-size:1.05rem}
.btn+.btn{margin-top:14px}
.input{width:100%;font-size:1.3rem;font-weight:700;padding:12px 16px;border-radius:14px;border:4px solid var(--ink);color:var(--ink);background:#fff;text-align:start}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.screen.enter{animation:slideIn .35s ease}

/* ============ الشريط العلوي ============ */
.topbar{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:8px 10px;margin-bottom:16px}
.avatar{width:54px;height:54px;flex:none;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:30px;cursor:pointer;
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.who{flex:1;min-width:0}
.who b{display:block;font-size:1.1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.who small{display:block;font-weight:700;color:#4b4f7a;line-height:1.2}
.xpbar{height:12px;border:2px solid var(--ink);background:#dfe3ff;border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd400,#ff8a00);transition:width .5s}

/* ============ شاشة البداية ============ */
.hero-banner{text-align:center;padding:6px 0 16px}
.hero-banner .badges{display:flex;justify-content:center;gap:10px;font-size:40px;margin-bottom:4px}
.hero-banner .badges span{animation:float 2.4s ease-in-out infinite;filter:drop-shadow(3px 3px 0 var(--ink))}
.hero-banner .badges span:nth-child(2){animation-delay:.4s}.hero-banner .badges span:nth-child(3){animation-delay:.8s}
.hero-banner h1{font-size:2.9rem;line-height:1.1}
.hero-banner .tag{font-weight:700;margin-top:6px;font-size:1.05rem}
.hero-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero-card{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.hero-card .hbadge{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.hero-card.selected{background:var(--pop);transform:translateY(-4px) rotate(-2deg);box-shadow:0 9px 0 var(--ink)}

/* ============ لوحة المواد ============ */
.greet{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.greet .gpic{width:64px;height:64px;flex:none;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.greet h2{font-size:1.5rem}
.section{font-size:1.3rem;margin:4px 4px 10px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.subject{position:relative;border:4px solid var(--ink);border-radius:20px;padding:14px 8px 12px;min-height:158px;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--sc);box-shadow:var(--sh);transition:transform .1s}
.subject:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.subject .ic{font-size:44px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}
.subject b{font-size:1.2rem;font-weight:800;line-height:1.2;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.subject small{font-weight:700;opacity:.95;text-align:center;line-height:1.2}
.subject .mini{width:82%;height:10px;border:2px solid var(--ink);background:rgba(0,0,0,.3);border-radius:9px;overflow:hidden;margin-top:4px}
.subject .mini i{display:block;height:100%;background:#fff}
.subject.last::after{content:attr(data-badge);position:absolute;top:-10px;inset-inline-end:8px;background:var(--pop);color:var(--ink);border:3px solid var(--ink);padding:0 8px;border-radius:10px;font-size:.8rem;font-weight:800;transform:rotate(3deg)}

/* ============ الدروس ============ */
.headrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.headrow h2{font-size:1.5rem;line-height:1.25}
.unit{margin:18px 4px 8px;font-weight:800;font-size:1.05rem}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:4px solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer;margin-bottom:14px;min-height:76px;font-size:1rem}
.lesson:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lesson .lic{width:56px;height:56px;flex:none;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:30px;background:var(--sc)}
.lesson .lt{flex:1;min-width:0}
.lesson .lt b{display:block;font-size:1.1rem;font-weight:800;line-height:1.3}
.lesson .lt small{font-weight:700;color:#4b4f7a}
.stars{font-size:1.05rem;letter-spacing:1px;white-space:nowrap}
.stars .off{filter:grayscale(1);opacity:.3}

/* ============ ساحة المعركة ============ */
.stage{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;background:rgba(255,255,255,.16);border:4px solid var(--ink);border-radius:var(--r);padding:12px 10px;margin-bottom:14px;overflow:hidden}
.fighter{flex:1;text-align:center;position:relative}
.fig{display:inline-grid;place-items:center;line-height:1;position:relative}
.fig.hero{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);font-size:46px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:4px 4px 0 var(--ink)}
.fig.villain{font-size:70px;filter:drop-shadow(4px 4px 0 var(--ink))}
.fig.villain.defeated{filter:grayscale(1) drop-shadow(3px 3px 0 var(--ink));transform:rotate(-14deg) scale(.9)}
.nm{font-weight:800;font-size:.95rem;margin-top:6px;text-shadow:2px 2px 0 var(--ink)}
.hp{height:14px;border:3px solid var(--ink);background:rgba(0,0,0,.4);border-radius:9px;overflow:hidden;margin:4px auto 0;width:90%}
.hp i{display:block;height:100%;background:var(--bad);transition:width .5s}
.vs{align-self:center;font-family:"Bangers",system-ui,sans-serif;font-size:2rem;color:var(--pop);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.cage{position:absolute;inset:-10px;display:none;place-items:center;font-size:92px;opacity:.92;pointer-events:none}
.trapped .cage{display:grid;animation:pop .3s}
.trapped .fig.hero{animation:shake .45s}
.jump .fig.hero{animation:jump .7s}
.hit .fig.villain{animation:shake .45s}
.loop .fig.hero{animation:jump 1.2s infinite}
.burst-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.burst{min-width:150px;padding:26px 30px;font-family:"Bangers","Baloo 2",system-ui,sans-serif;font-size:2.1rem;color:var(--ink);text-align:center;line-height:1;
  background:var(--pop);clip-path:polygon(50% 0,60% 18%,78% 6%,78% 26%,98% 24%,88% 42%,100% 55%,84% 64%,94% 84%,74% 80%,68% 98%,54% 84%,40% 100%,32% 82%,12% 90%,18% 70%,0 60%,14% 46%,4% 28%,24% 28%,26% 8%,42% 20%);
  animation:burst .9s forwards}
.burst.bad{background:#cfd3f5}
body:not(.lang-en) .burst{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;font-weight:800}
.xp-float{position:absolute;top:6px;inset-inline-start:42%;font-weight:800;font-size:1.7rem;color:var(--pop);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);animation:floatUp 1.3s forwards;z-index:4}

/* ============ السؤال ============ */
.qvis{white-space:pre-line}
.vert{font-family:"Courier New",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate;white-space:pre;text-align:center;font-size:2rem;font-weight:800;line-height:1.25;background:var(--soft);border:3px dashed var(--ink);border-radius:14px;padding:8px 18px;width:max-content;max-width:100%;margin:6px auto 10px;color:var(--ink)}
.note{background:#fff7cc;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.8;margin:0 0 14px;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.note b{display:block;margin-bottom:2px}

.qprog{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:12px}
.qprog .bar{flex:1;height:16px;border:3px solid var(--ink);background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--pop);transition:width .4s}
.qcard{padding:16px 14px}
.qvis{font-size:36px;line-height:1.3;text-align:center;word-break:break-word;margin-bottom:4px}
.qtext{font-size:1.5rem;font-weight:800;line-height:1.65;text-align:center;margin-bottom:10px}
.math{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800;letter-spacing:.03em}
.options{display:grid;gap:12px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;min-height:66px;width:100%;border:4px solid var(--ink);background:#fff;color:var(--ink);border-radius:16px;padding:8px 12px;font-size:1.25rem;font-weight:800;text-align:start;cursor:pointer;box-shadow:0 5px 0 var(--ink);line-height:1.4}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt .letter{width:40px;height:40px;flex:none;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;background:var(--main);color:var(--main-ink);font-weight:800}
.opt.correct{background:#c9f7d8;border-color:var(--ink);animation:pop .3s}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.wrong{background:#ffd3d3;opacity:.8;animation:shake .4s}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border:4px solid var(--ink);border-radius:16px;padding:12px 14px;font-weight:800;font-size:1.15rem;animation:pop .3s}
.feedback.good{background:#c9f7d8}.feedback.bad{background:#ffd3d3}
.feedback .hint{display:block;font-weight:600;font-size:1rem;margin-top:6px}
#nextWrap{margin-top:14px}
.storycard .tag{display:inline-block;background:var(--pop);border:3px solid var(--ink);padding:0 12px;border-radius:10px;font-weight:800;margin-bottom:8px;transform:rotate(-1.5deg)}
.story{font-size:1.25rem;font-weight:600;line-height:1.85;margin:6px 0 14px}

/* ============ النتيجة ============ */
.result h2{font-size:2rem;margin:4px 0}
.trophy{font-size:64px;animation:float 2s ease-in-out infinite}
.bigstars{font-size:2.6rem;margin:6px 0}
.bigstars .off{filter:grayscale(1);opacity:.3}
.stat{display:inline-block;background:var(--pop);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-weight:800;margin:4px}
.levelup{background:var(--ok);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;margin:10px 0;animation:pop .5s}

/* ============ نافذة الملف الشخصي ============ */
.modal-back{position:fixed;inset:0;background:rgba(10,8,40,.72);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-width:460px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:var(--sh)}
.modal h2{margin-bottom:6px}

/* ============ الحركة ============ */
.confetti{position:absolute;top:-20px;width:11px;height:15px;border:2px solid var(--ink);animation:fall linear forwards}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-8deg) scale(1.1)}60%{transform:translateY(0) rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes burst{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.15) rotate(4deg);opacity:1}80%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(112vh) rotate(720deg);opacity:.9}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:380px){.hero-banner h1{font-size:2.4rem}.qtext{font-size:1.3rem}.opt{font-size:1.1rem}.subject b{font-size:1.05rem}}
</style>
</head>
<body data-hero="spiderman">
<div id="bg" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<div id="app">
  <header id="topbar" class="topbar" hidden></header>
  <main id="screen" class="screen" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<noscript><p style="padding:20px;color:#fff;font-size:1.3rem">لتشغيل مدرسة الأبطال فعّل JavaScript من فضلك. / Please enable JavaScript.</p></noscript>
<script>
/*
  ============================================================
  مدرسة الأبطال (Heroes Academy) - ملف واحد جاهز لـ GitHub Pages
  ============================================================
  كيف تضيف درساً جديداً؟ (في أي مكان بعد هذا الملف أو في نهاية السكربت):

    HA.add('math',                       // رمز المادة: arabic | math | religion | discover | mathEn | english
           'الوحدة الرابعة',              // اسم الوحدة (يُجمّع الدروس تحتها)
           'math-10',                    // رمز فريد للدرس
           'عنوان الدرس', '📐',           // العنوان + أيقونة
           [
             // [نص السؤال, [الإجابة الصحيحة أولاً, خطأ1, خطأ2, ...], تلميح اختياري, صورة/إيموجي اختياري]
             ['ما ناتج {{12 + 7 = ?}}', ['19','18','20'], 'عُدّ من 12 سبع مرات', '🍎'],
           ]);

  - الإجابة الصحيحة تُكتب دائماً أولاً؛ الكود يخلط ترتيب الخيارات تلقائياً.
  - من 2 إلى 4 خيارات لكل سؤال (اثنان فقط لأسئلة صح/خطأ).
  - اكتب الأرقام دائماً غربية 1 2 3 وسيحوّلها الكود تلقائياً إلى ١ ٢ ٣ في المواد العربية.
  - ضع العمليات الحسابية بين {{ }} لتظهر بترتيب صحيح: {{12 + 7 = ?}}
  - لغة المادة (عربي RTL أو إنجليزي LTR) تُحدَّد في قائمة SUBJECTS بالحقل lang.
*/
(function () {
'use strict';

/* ===================== 1) أدوات مساعدة ===================== */
const KEY = 'heroesAcademy.v2';
const XP_FIRST = 10, XP_RETRY = 5, XP_LEVEL = 100;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const AR_DIGITS = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
const toAr = s => String(s).replace(/[0-9]/g, d => AR_DIGITS[+d]);
const tpl = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
const num = (n, lang) => ((lang || curLang) === 'ar' ? toAr(n) : String(n));
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 20);

/* تحويل نص السؤال إلى HTML: أرقام حسب اللغة + {{عمليات}} */
function fmt(text, lang) {
  let s = String(text);
  if (lang === 'ar') s = toAr(s).replace(/\?/g, '؟');
  s = esc(s);
  return s.replace(/\{\{(.+?)\}\}/g, '<span class="math">$1</span>');
}

/* ===================== 2) الأبطال والأشرار والقصص ===================== */
const HEROES = {
  spiderman: {
    emoji: '🕷️', colors: ['#e62429', '#1f4fd8'], trap: '🕸️',
    name: { ar: 'سبايدرمان', en: 'Spider-Man' },

function speakable(text, lang) {
  const w = MATH_WORDS[lang];
  return String(text).replace(/\{\{|\}\}/g, '')
    .replace(/\s*\+\s*/g, ' ' + w.plus + ' ').replace(/\s[-−–]\s/g, ' ' + w.minus + ' ')
    .replace(/\s*×\s*/g, ' ' + w.times + ' ').replace(/\s*÷\s*/g, ' ' + w.div + ' ')
    .replace(/\s*=\s*/g, ' ' + w.eq + ' ').replace(/\s>\s/g, ' ' + w.gt + ' ').replace(/\s<\s/g, ' ' + w.lt + ' ')
    .replace(/_{2,}|\.{3,}|…+/g, ' ' + w.blank + ' ');
}
const Speech = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices() || []; } catch (e) { /* تجاهل */ } };
    load();
    if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = load;
  },
  pick(lang) {
    const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
    for (const p of UI[lang].speechPrefs) { const v = this.voices.find(x => norm(x) === p.toLowerCase()); if (v) return v; }
    return this.voices.find(x => norm(x).startsWith(lang)) || null;
  },
  speak(text, lang, force) {
    if (!this.ok || !text || (!state.sound && !force)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(speakable(text, lang));
      const v = this.pick(lang);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = UI[lang].fallbackSpeech; }
      u.rate = lang === 'ar' ? 0.88 : 0.9; u.pitch = 1.15; u.volume = 1;
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { /* تجاهل */ } }, 60);
    } catch (e) { /* تجاهل */ }
  },
  stop() { if (this.ok) { try { speechSynthesis.cancel(); } catch (e) { /* تجاهل */ } } }
};
const SFX = {
  ctx: null,
  play(kind) {
    if (!state.sound) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = this.ctx || new C(); const ctx = this.ctx;
      const notes = kind === 'ok' ? [523, 659, 784] : kind === 'bad' ? [220, 165] : kind === 'win' ? [523, 659, 784, 1047] : [440];
      let at = ctx.currentTime;
      notes.forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = kind === 'bad' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.14, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
        o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at + 0.18); at += 0.13;
      });
    } catch (e) { /* تجاهل */ }
  }
};

/* ===================== 8) الدرس والأسئلة ===================== */
function openSubject(id) { state.subject = id; save(); go('lessons', { subjectId: id }); }
function newSession(sid, lid) {
  const subj = getSubject(sid), lessons = lessonsOf(sid), lesson = lessons.find(l => l.id === lid), index = lessons.indexOf(lesson);
  const lang = subj.lang, stories = hero().stories[lang];
  session = {
    subjectId: sid, lessonId: lid, lesson: lesson, index: index, lang: lang, icon: lesson.icon || subj.icon,
    qs: resolveQs(lesson), idx: 0, total: 0, correctCount: 0, mistakes: 0, qMistakes: 0, firstTry: 0, earned: 0,
    options: [], answered: false, levelBefore: levelInfo(state.xp).level,
    storyText: tpl(stories[index % stories.length], vars(lang)), stars: 0, bonus: 0, leveledUp: false, finishText: '', levelText: ''
  };
  session.total = session.qs.length;
  prepareQuestion();
}
function prepareQuestion() {
  const q = session.qs[session.idx];
  const list = q.options.map((text, i) => ({ text: text, correct: i === q.answer, tried: false }));
  session.options = q.fixed ? list : shuffle(list);
  session.answered = false; session.qMistakes = 0;
}
function openLesson(lid) {
  newSession(view.subjectId, lid);
  go('story');
  Speech.speak(session.storyText, session.lang);
}
function addXP(n) { state.xp += n; save(); renderTopbar(); }
function showFeedback(kind, msg, hint) {
  const fb = $('#feedback'); if (!fb) return;
  fb.innerHTML = '<div class="feedback ' + kind + '">' + fmt(msg, session.lang) + (hint ? '<span class="hint">' + esc(t('hintLabel')) + fmt(hint, session.lang) + '</span>' : '') + '</div>';
}
function showBurst(kind) {
  const w = $('#burstWrap'); if (!w) return;
  w.innerHTML = '<div class="burst' + (kind === 'bad' ? ' bad' : '') + '">' + esc(kind === 'bad' ? t('oops') : t('pow')) + '</div>';
  setTimeout(() => { if (w) w.innerHTML = ''; }, 950);
}
function floatXP(n) {
  const st = $('#stage'); if (!st) return;
  const f = document.createElement('span'); f.className = 'xp-float'; f.textContent = '+' + num(n) + ' ' + t('xp');
  st.appendChild(f); setTimeout(() => f.remove(), 1300);
}
function onAnswer(i) {
  const s = session; if (!s || s.answered) return;
  const o = s.options[i]; if (!o || o.tried) return;
  const btn = $('#options [data-i="' + i + '"]'), q = s.qs[s.idx], lang = s.lang;
  if (o.correct) {
    s.answered = true;
    const first = s.qMistakes === 0, award = first ? XP_FIRST : XP_RETRY;
    if (first) s.firstTry++;
    addXP(award); s.earned += award; s.correctCount++;
    btn.classList.add('correct'); $$('#options .opt').forEach(b => { b.disabled = true; });
    $('#heroBox').classList.remove('trapped');
    const hp = $('#villainHp'); if (hp) hp.style.width = ((s.total - s.correctCount) / s.total * 100) + '%';
    replayAnim($('#heroBox'), 'jump'); replayAnim($('#villainBox'), 'hit');
    showBurst('ok'); floatXP(award); confetti(first ? 34 : 16); SFX.play('ok');
    const msg = say('cheer', lang); showFeedback('good', msg); Speech.speak(msg, lang);
    const last = s.idx + 1 >= s.total;
    $('#nextWrap').innerHTML = '<button class="btn green" id="nextBtn" data-action="next">' + (last ? t('finish') : t('next')) + '</button>';
    const nb = $('#nextBtn'); if (nb) { nb.focus({ preventScroll: true }); nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  } else {
    o.tried = true; s.qMistakes++; s.mistakes++;
    btn.classList.add('wrong'); btn.disabled = true;
    replayAnim($('#heroBox'), 'trapped'); showBurst('bad'); SFX.play('bad');
    const msg = say('retry', lang); showFeedback('bad', msg, q.hint); Speech.speak(msg, lang);
  }
}
function nextQuestion() {
  const s = session; if (!s) return;
  if (s.idx + 1 < s.total) { s.idx++; prepareQuestion(); render(); window.scrollTo(0, 0); } else { finishLesson(); }
}
function finishLesson() {
  const s = session;
  const stars = s.mistakes === 0 ? 3 : (s.mistakes <= Math.ceil(s.total / 2) ? 2 : 1), bonus = stars * 5;
  s.stars = stars; s.bonus = bonus; s.earned += bonus; state.xp += bonus;
  const p = (state.progress[s.subjectId] = state.progress[s.subjectId] || {}), prev = p[s.lessonId];
  p[s.lessonId] = { done: true, stars: Math.max(prev ? prev.stars : 0, stars), plays: (prev ? prev.plays : 0) + 1 };
  save();
  const lvl = levelInfo(state.xp).level; s.leveledUp = lvl > s.levelBefore;
  s.finishText = say('finish', s.lang); s.levelText = s.leveledUp ? say('levelUp', s.lang, { level: lvl }) : '';
  go('result'); confetti(90); SFX.play('win');
  Speech.speak(s.finishText + (s.leveledUp ? ' ' + s.levelText : ''), s.lang);
}

function bind() {

/* ============================================================
   أدوات بناء الأسئلة + مولّدات الرياضيات (أرقام عشوائية جديدة في كل محاولة)
   ============================================================ */
window.HAH = (function () {
  'use strict';
  const U = HA.util, shuffle = U.shuffle, rand = U.rand;
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pickN = (a, n) => shuffle(a).slice(0, n);
  const mk = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const T = (lang, ar, en) => (lang === 'ar' ? ar : en);

  /* سؤال ثابت: Q('النص', 'الإجابة الصحيحة', 'خطأ1', 'خطأ2')  ← الصحيحة أولاً دائماً */
  const Q = (q, a, ...w) => [q, [a].concat(w), '', ''];
  const H = (arr, h) => { arr[2] = h; return arr; };      // إضافة تلميح
  const V = (arr, v) => { arr[3] = v; return arr; };      // إضافة صورة/إيموجي
  const TA = (q, ok) => ({ q: q, options: ['صح ✅', 'خطأ ❌'], answer: ok ? 0 : 1, fixed: true, hint: '', visual: '' });
  const TE = (q, ok) => ({ q: q, options: ['True ✅', 'False ❌'], answer: ok ? 0 : 1, fixed: true, hint: '', visual: '' });

  /* سؤال إجابته رقم: الخيارات الخاطئة قريبة من الصحيحة (±1 ، ±10) */
  function numQ(q, c, extra) {
    const cand = [c + 10, c - 10, c + 1, c - 1, c + 2, c - 2].filter(x => x >= 0 && x !== c);
    const w = pickN(cand, 3).map(String);
    return Object.assign({ q: q, options: [String(c)].concat(w), answer: 0, hint: '', visual: '' }, extra || {});
  }
  const opts = (q, c, wrongs, extra) => Object.assign({ q: q, options: [String(c)].concat(wrongs.map(String)), answer: 0, hint: '', visual: '' }, extra || {});
  const vert = (a, b, op) => {
    const w = Math.max(String(a).length, String(b).length) + 1;
    return String(a).padStart(w, ' ') + '\n' + op + String(b).padStart(w - 1, ' ') + '\n' + '─'.repeat(w);
  };
  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const numWords = n => {
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
    const h = Math.floor(n / 100), r = n % 100;
    return ONES[h] + ' hundred' + (r ? ' and ' + numWords(r) : '');
  };
  const distinctDigits = n => { const s = String(n); return new Set(s).size === s.length && !s.includes('0'); };
  const rn3 = () => { let n; do { n = ri(123, 987); } while (!distinctDigits(n)); return n; };
  const BOX = '▢';

  /* ================= مولّدات الرياضيات (عربي/إنجليزي) ================= */
  const ITEMS = [['🍎', 'تفاح', 'apples'], ['🍌', 'موز', 'bananas'], ['🍇', 'عنب', 'grapes'], ['🍓', 'فراولة', 'strawberries'], ['🍊', 'برتقال', 'oranges'], ['⚽', 'كرات', 'balls'], ['🚗', 'سيارات', 'cars'], ['🐟', 'أسماك', 'fish'], ['🌸', 'ورود', 'flowers'], ['⭐', 'نجوم', 'stars']];
  const M = {
    /* رسم بياني بالصور (Pictograph) */
    graph: lang => () => mk(12, () => {
      const items = pickN(ITEMS, 3), counts = pickN([1, 2, 3, 4, 5, 6], 3);
      const nm = i => items[i][lang === 'ar' ? 1 : 2];
      const visual = items.map((it, i) => nm(i) + ': ' + it[0].repeat(counts[i])).join('\n');
      const order = counts.map((c, i) => i).sort((a, b) => counts[b] - counts[a]);
      const kind = ri(0, 4);
      if (kind === 0) { const i = ri(0, 2); return Object.assign(numQ(T(lang, 'كم عدد ' + nm(i) + ' في الرسم؟', 'How many ' + nm(i) + ' are in the graph?'), counts[i]), { visual: visual }); }
      if (kind === 1) return Object.assign(opts(T(lang, 'أي صنف عدده هو الأكبر؟', 'Which one has the most?'), nm(order[0]), [nm(order[1]), nm(order[2])]), { visual: visual });
      if (kind === 2) return Object.assign(opts(T(lang, 'أي صنف عدده هو الأقل؟', 'Which one has the least?'), nm(order[2]), [nm(order[0]), nm(order[1])]), { visual: visual });
      if (kind === 3) return Object.assign(numQ(T(lang, 'كم يزيد عدد ' + nm(order[0]) + ' على عدد ' + nm(order[2]) + '؟', 'How many more ' + nm(order[0]) + ' than ' + nm(order[2]) + '?'), counts[order[0]] - counts[order[2]]), { visual: visual });
      return Object.assign(numQ(T(lang, 'كم العدد الكلي للأصناف الثلاثة؟', 'How many are there in all?'), counts[0] + counts[1] + counts[2]), { visual: visual });
    }),
    /* جمع رأسي */
    addV: (lang, lo, hi, mode) => () => mk(12, () => {
      let a, b;
      for (let k = 0; k < 80; k++) {
        a = ri(lo, hi); b = ri(lo, hi);
        const u = (a % 10) + (b % 10), okm = mode === 'noreg' ? u < 10 : mode === 'reg' ? u >= 10 : true;
        if (okm && a + b < 1000) break;
      }
      return numQ(T(lang, 'أوجد ناتج الجمع:', 'Find the sum:'), a + b, { vert: vert(a, b, '+') });
    }),
    /* طرح رأسي */
    subV: (lang, lo, hi, mode) => () => mk(12, () => {
      let a, b;
      for (let k = 0; k < 80; k++) {
        a = ri(lo, hi); b = ri(lo, hi);
        if (a < b) { const t = a; a = b; b = t; }
        const okm = mode === 'noreg' ? (a % 10) >= (b % 10) : mode === 'reg' ? (a % 10) < (b % 10) : true;
        if (okm && a > b) break;
      }
      return numQ(T(lang, 'أوجد ناتج الطرح:', 'Find the difference:'), a - b, { vert: vert(a, b, '−') });
    }),
    /* عمليات أفقية بسيطة: kind = add | sub | mix */
    simple: (lang, kind, lo, hi) => () => mk(12, () => {
      let a = ri(lo, hi), b = ri(lo, hi); const sub = kind === 'sub' || (kind === 'mix' && Math.random() < .5);
      if (sub) { if (a < b) { const t = a; a = b; b = t; } return numQ('{{' + a + ' − ' + b + ' = ?}}', a - b); }
      return numQ('{{' + a + ' + ' + b + ' = ?}}', a + b);
    }),
    doubles: lang => () => mk(12, () => {
      const n = ri(1, 12), near = Math.random() < .4;
      if (near) return Object.assign(numQ('{{' + n + ' + ' + (n + 1) + ' = ?}}', 2 * n + 1), { hint: T(lang, 'فكّر: ' + n + ' + ' + n + ' ثم زِد ١', 'Think: ' + n + ' + ' + n + ' then add 1') });
      return Object.assign(numQ('{{' + n + ' + ' + n + ' = ?}}', 2 * n), { hint: T(lang, 'ضِعف العدد ' + n, 'Double of ' + n) });
    }),
    makeTen: lang => () => mk(12, () => {
      if (Math.random() < .5) { const a = ri(1, 9); return opts('{{' + a + ' + ' + BOX + ' = 10}}', 10 - a, [11 - a, 9 - a, 10 - a + 2].filter(x => x >= 0 && x !== 10 - a).slice(0, 3)); }
      const a = ri(6, 9), b = ri(3, 9 - 0); return Object.assign(numQ('{{' + a + ' + ' + b + ' = ?}}', a + b), { hint: T(lang, 'كوِّن ١٠ أولاً: ' + a + ' + ' + (10 - a) + ' = ١٠', 'Make ten first: ' + a + ' + ' + (10 - a) + ' = 10') });

  add(S, UG, 'e-order', 'Build the Sentence', '🧩', () => {
    const SEN = ['This is a desk.', 'He is a teacher.', 'This is a bag.', 'This is a pencil.', 'This is a book.', 'This is a red circle.', 'This is a blue square.', 'What is this?', 'How many pens are there?', 'There are eight books.', 'I walk to school.', 'I play tennis after school.', 'I ride my bike.', 'Is this your ball?', 'What is she doing?', 'She is reading a book.', 'I have two sisters.', 'Good morning, Mrs. Sara.', 'I get up at seven o\'clock.', 'How are you?', 'I\'m fine, thank you.', 'I love my school.', 'My teacher is kind.', 'The cat plays with the ball.', 'He has two arms.'];
    const scr = arr => { let s; for (let k = 0; k < 20; k++) { s = shuffle(arr); if (s.join(' ') !== arr.join(' ')) return s; } return arr.slice().reverse(); };
    return SEN.map(sn => {
      const end = sn.slice(-1), core = sn.slice(0, -1), words = core.split(' ');
      const shown = scr(words).join(' / ') + end;
      const w = []; let guard = 0;
      while (w.length < 2 && guard++ < 40) { const c = scr(words).join(' ') + end; if (c !== sn && w.indexOf(c) < 0) w.push(c); }
      return Q('Reorder the words: ' + shown, sn, ...w);
    });
  }, { n: 8, note: 'A sentence starts with a capital letter, has the words in the right order, and ends with a full stop (.) or a question mark (?).' });
